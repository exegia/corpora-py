name: Run unit tests

on:
  push:

  pull_request:
    branches:
      - main

  schedule:
    # Every sunday at 8:05 UTC
    - cron: "5 8 * * 0"

# If you trigger a new workflow while the previous one is running,
# this will cancel the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      # Use matrix strategy to run the tests on multiple Py versions on multiple OSs.
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ "3.13", "3.14" ]

    # uv provisions the matrix Python itself (no setup-python needed).
    # Action refs must match the org's allowed-actions policy — use the
    # same versions as the other passing workflows (see docker.yml).
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the Dependencies
        run: |
          echo "Installing the dependencies..."
          uv python install ${{ matrix.python-version }}
          uv sync

      - name: Check Linter
        run: |
          echo "Checking linter formatting..."
          make lint-check

      - name: Run Tests
        run: |
          echo "Running the tests..."
          make test
