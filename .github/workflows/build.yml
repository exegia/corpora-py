name: Build and test containers

# Manual-only for now: this workflow spins up the combined FastAPI app
# (docker compose, health check on :5002 via Caddy) which depends on
# src/corpora_py/app.py — not yet ported to the merged package layout
# (it imported the removed common/corpora_mcp modules). Re-enable push/PR
# triggers once the corpora-api port lands.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [313, 314]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Spin up container
      run: |
        sed -i "s/PYTHON_VERSION=.*/PYTHON_VERSION=${{ matrix.python-version }}/" '.env'
        echo "Building container for Python ${{ matrix.python-version }}."
        docker compose up -d

    - name: Wait and check the health of the container
      run: |
        attempts=0

        while [ $attempts -lt 5 ]; do
          if curl http://localhost:5002; then
            echo "Success!"
            exit 0
          fi

          attempts=$((attempts+1))
          sleep 1
        done

        echo "Failed after $attempts attempts"
        exit 1
