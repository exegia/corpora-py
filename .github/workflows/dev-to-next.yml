name: Dev to Next Workflow

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, edited, reopened]
    branches:
      - next

permissions:
  pull-requests: write
  contents: write

jobs:
  draft_pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create or Update Draft PR
        run: |
          PR=$(gh pr list --base next --head dev --json number --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" == "null" ]; then
            gh pr create --base next --head dev --title "chore: upcoming release to next" --body "Automated draft PR from dev to next." --draft
          else
            echo "Draft PR already exists: $PR"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smart_versioning:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'next' && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Run Smart Version Tagging
        run: |
          python scripts/smart_version_tagging.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
