name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*" # e.g. v1.2.3-rc1

  pull_request:
    types: [ closed ]
    branches: [ master, main ]

  workflow_dispatch:
    inputs:
      publish:
        description: "Force the publish step to run even if the tag is not a release tag"
        required: false
        type: boolean
        default: false

# ── jobs ──────────────────────────────────────────────────────────────────────

jobs:
  # Runs only when a PR is merged. Bumps the patch version across all workspace
  # packages, commits back to the base branch with [skip ci], and pushes a
  # vX.Y.Z tag to trigger the release.
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Bump version
        id: bump
        uses: ./.github/actions/bump-version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}

  # Builds all workspace wheels. Runs after a successful bump, on a tag push,
  # or on workflow_dispatch. Skips for PRs closed without merging.
  build:
    name: Build distributions
    needs: bump
    if: |
      always() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.bump.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the newly-created tag when bump ran; otherwise the triggering ref.
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      - name: Build
        uses: ./.github/actions/build-dist

  # Publishes all workspace wheels to PyPI (corpora-shared, corpora-client,
  # corpora-admin, corpora-py). Uses OIDC trusted publishing — no stored token.
  publish:
    name: Publish Python 🐍 distributions 📦 to PyPI
    needs: [bump, build]
    if: |
      always() && needs.build.result == 'success' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == true)
      )
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/corpora-py
    permissions:
      actions: read
      id-token: write  # mandatory for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        uses: ./.github/actions/publish-pypi
