name: Demo App - Docker Image

# Builds and (optionally) publishes a dev container image for the ElectroBun "example.
# The image contains Bun + the local Python library (editable venv inside container).
# Bundling of the "frozen" embedded Python (wheel + standalone) is driven from
# root scripts/ (see scripts/build_embedded_python.py and scripts/setup.py).
# The dev container sets up a venv shim + DEV_PYTHON_BIN override on start.
#
# MANUAL-ONLY until example/Dockerfile is rewritten: the Dockerfile is a
# stale npm/react-router template from before the example-app restructure —
# it COPYs a `corpora/` directory that no longer exists and runs `npm ci`
# against a package-lock.json that isn't there (the example app is a
# bun/ElectroBun project with bun.lock). Every push/PR-triggered run failed
# on that for months, so the automatic triggers are disabled rather than
# left red; re-add push/pull_request triggers once the Dockerfile actually
# builds.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-example-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # The example app's Dockerfile lives at example/Dockerfile (the old
          # example/docker/ path predates a restructure and broke every run).
          file: example/Dockerfile
          push: |
            ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64 # add arm64 if you need Apple Silicon dev images

      - name: Summary
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
