name: Demo App - Docker Image

# Builds and (optionally) publishes a dev container image for the ElectroBun demo.
# The image contains Bun + the local Python library (editable venv inside container).
# Bundling of the "frozen" embedded Python (wheel + standalone) is driven from
# root scripts/ (see scripts/build_embedded_python.py and scripts/setup.py).
# The dev container sets up a venv shim + DEV_PYTHON_BIN override on start.
#
# - Builds on changes under demo/app/ or the Python source
# - Uses cache for fast rebuilds
# - Pushes to GHCR when on dev / main (or manually via workflow_dispatch)

on:
  push:
    branches: [dev, next, main]
    paths:
      - "demo/app/**"
      - "src/exegia/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/demo-app-docker.yml"
  pull_request:
    paths:
      - "demo/app/**"
      - "src/exegia/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-demo-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: demo/app/Dockerfile
          push: |
            ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' ? inputs.push : true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64 # add arm64 if you need Apple Silicon dev images

      - name: Summary
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
