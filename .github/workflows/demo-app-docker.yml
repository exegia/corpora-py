name: Demo App - Docker Image

# Builds and (optionally) publishes a dev container image for the ElectroBun "example.
# The image contains Bun + the local Python library (editable venv inside container).
# Bundling of the "frozen" embedded Python (wheel + standalone) is driven from
# root scripts/ (see scripts/build_embedded_python.py and scripts/setup.py).
# The dev container sets up a venv shim + DEV_PYTHON_BIN override on start.
#
# - Builds on changes under example/app/ or the Python source
# - Uses cache for fast rebuilds
# - Pushes to GHCR when on dev / main (or manually via workflow_dispatch)

on:
  push:
    branches: [ dev, next, main ]
    paths:
      - "example/app/**"
      - "src/corpora-py/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/example-app-docker.yml"
  pull_request:
    paths:
      - "example/app/**"
      - "src/corpora-py/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-example-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: example/docker/Dockerfile
          push: |
            ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64 # add arm64 if you need Apple Silicon dev images

      - name: Summary
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
