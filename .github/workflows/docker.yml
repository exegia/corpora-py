name: Docker

# Builds and pushes three images to GHCR:
#   ghcr.io/exegia/corpora-py — umbrella (MCP server + admin tools, full)
#
# Triggers:
#   - Push to main → tags: latest, sha-<short>
#   - Push of a vX.Y.Z tag → tags: latest, vX.Y.Z, X.Y, X
#   - Pull request → build only (no push), for CI validation
#   - workflow_dispatch → manual run with optional push toggle

on:
  push:
    branches: [ main ]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    paths:
      # Only rebuild when relevant files change
      - "Dockerfile*"
      - "docker-compose.yml"
      - "packages/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker.yml"

  pull_request:
    branches: [ main ]
    paths:
      - "Dockerfile*"
      - "packages/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"

  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR (default: true)"
        required: false
        type: boolean
        default: true

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read
  packages: write   # required to push to GHCR

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  build-push:
    name: Build & push (${{ matrix.image.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # keep building other images if one fails
      matrix:
        image:
          - name: corpora-py
            dockerfile: Dockerfile
            description: "Corpora platform — MCP server + admin tools (full umbrella)"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── QEMU + Buildx for multi-platform builds ──────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # ── Login to GHCR ─────────────────────────────────────────────────────
      # Also needed on PRs so cache-from can read the (private) buildcache.
      # Fork PRs get a read-only token, which is fine: cache-to is disabled
      # for the PRs below.
      - name: Log in to GHCR
        uses: docker/login-action@v4 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Compute tags and labels ───────────────────────────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          flavor: |
            latest=auto
          tags: |
            # vX.Y.Z tag → vX.Y.Z, X.Y, X, latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Branch push → latest (handled by flavor above) + sha-<short>
            type=sha,prefix=sha-,format=short
            # PR → pr-<number> (push disabled via the login step guard)
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # ── Build (and push when not a PR) ────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v7 # v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: reuse layers across runs via GHCR cache.
          # Writing the cache needs packages:write, which PRs don't reliably
          # have (and PR layers shouldn't pollute the shared cache), so
          # cache-to is disabled on pull requests.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode=max', github.repository_owner, matrix.image.name) || '' }}
