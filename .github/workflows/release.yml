# A release PR landed on main: tag it, then open the next release branch.
#
# Nothing is re-tested here — the exact tree being released already passed
# `check` and `package` on the release PR.
#
# There is no deploy job. Both Vercel projects (the API at the repo root and
# the web example under example/) are wired to Vercel's Git integration, which
# already deploys a preview for every release-branch push and production for
# the trunk. A CLI deploy here would double-fire on every commit, and
# `--prebuilt` is not viable for the Python runtime anyway — Vercel's build
# image is what supplies uv.
#
# Everything downstream hangs off the tag `make tag-release` pushes:
# publish.yml sends the wheel to PyPI and build-sidecar.yml builds the signed
# per-platform bundles. Both are `push: tags: v*` workflows, and events raised
# by GITHUB_TOKEN do not start workflow runs — so the tag MUST be created with
# the automation App's token or both go silently dead.
#
# The dispatch is the bootstrap: it opens a release branch without a preceding
# release, which is how the first one (and any manual re-cut) gets created.
name: Release

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump for the next release branch
        default: minor
        type: choice
        options: [ major, minor, patch ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Full history: `gh release --generate-notes` needs the preceding tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: make tag-release

      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: make delete-branch

  next-release:
    name: next-release
    needs: [ release ]
    # `release` is skipped on a manual dispatch, which is exactly the bootstrap
    # case — so run whenever it did not actually fail.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      # Full history and tags: `make next-version` reads the newest vX.Y.Z tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      # `make release-branch` re-locks: uv.lock pins the workspace versions.
      - uses: ./.github/actions/setup

      - name: Open the next release branch
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
        run: |
          git config user.name  "corpora-automation[bot]"
          git config user.email "corpora-automation[bot]@users.noreply.github.com"
          make release-branch
