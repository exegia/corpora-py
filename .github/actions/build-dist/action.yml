name: 'Build Distribution'
description: 'Installs uv, builds all workspace packages, and uploads artifacts'
runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Build all workspace packages
      shell: bash
      run: |
        # Build each workspace package separately so they can be published independently
        uv build --package corpora-shared-py --wheel --out-dir dist/
        uv build --package corpora-client-py --wheel --out-dir dist/
        uv build --package corpora-admin-py  --wheel --out-dir dist/
        # Also build the umbrella package (corpora-py) for sidecar/demo installs
        uv build --wheel --out-dir dist/
        echo "Built wheels:"
        ls -lh dist/*.whl

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error
