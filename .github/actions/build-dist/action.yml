name: 'Build Distribution'
description: 'Installs uv, builds all workspace packages, and uploads artifacts'
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        enable-cache: true

    - name: Build the corpora-py wheel
      shell: bash
      run: |
        # corpora-py is the only published package: its wheel bundles the
        # source of every workspace member (see the root pyproject's
        # [tool.hatch.build.targets.wheel]), so a single self-contained wheel
        # is all that goes to PyPI.
        uv build --wheel --out-dir dist/
        echo "Built wheels:"
        ls -lh dist/*.whl

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error
