name: "Build Distribution"
description: "Installs uv, builds all workspace packages, and uploads artifacts"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Build all workspace packages
      shell: bash
      run: |
        uv build --wheel --out-dir dist/
        echo "Built wheel:"
        ls -lh dist/*.whl

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error
