[project]
name = "corpora-py"
version = "1.1.0"
description = "Graph-based biblical and religious text study platform (all-in-one umbrella)"
readme = "README.md"
authors = [{ name = "Emmanuel De Freitas", email = "emmanuel@exegia.co" }]
requires-python = ">=3.13"
keywords = ["exegia", "bible", "corpus", "text-fabric", "context-fabric", "mcp", "graphql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
license-files = ["LICENSE"]
# Self-contained: this wheel BUNDLES the source of the corpora-common,
# corpora-mcp and corpora-admin workspace packages (see
# [tool.hatch.build.targets.wheel]), so `pip install corpora-py` pulls
# nothing corpora-* from PyPI — only their third-party deps, declared
# directly below. corpora-py is the only package published to PyPI.
dependencies = [
    "dotenvx>=0.0.0",
    # ── common (settings, auth, web) ──
    "pydantic-settings>=2.14.2",
    "fastapi>=0.139.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.10.0",
    "pyjwt>=2.13.0",
    # ── mcp server ──
    "fastmcp>=3.4.2",
    "python-multipart>=0.0.32",
    # ── admin (parsing + Context-Fabric conversion) ──
    "context-fabric>=0.5.7",
    "text-fabric>=13.1.0",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "huggingface-hub>=1.0",
    "docling-core>=2.30",
    "jsonschema>=4.25",
    "referencing>=0.36",
    # Combined FastAPI app (MCP + conversion API)
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
# Full Docling converter for /ingest (admin.ingest) — heavy (torch). Enable
# with `uv sync --extra docling` in dev, or install `corpora-py[docling]`.
docling = ["docling>=2.0"]

[project.scripts]
# Re-exported from corpora-mcp for convenience
cf-mcp = "corpora_mcp.server:main"
# Combined FastAPI app: MCP server + admin conversion API
corpora-api = "corpora_py.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Self-contained wheel: bundle the source of every workspace member into this
# single corpora-py distribution so it is the only package that needs to exist
# on PyPI. (Their third-party deps are declared in [project.dependencies].)
packages = [
    "src/corpora_py",
    "packages/common/src/common",
    "packages/mcp/src/corpora_mcp",
    "packages/admin/src/admin",
]

[tool.hatch.build.targets.editable]
# Dev editable exposes only corpora_py; the other members are installed as
# editable workspace packages via the dev dependency-group, so local imports
# of admin/common/corpora_mcp resolve to their own source trees.
packages = ["src/corpora_py"]

# ── uv workspace ──────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# Resolve workspace members from local paths during development
corpora-common = { workspace = true }
corpora-mcp = { workspace = true }
corpora-admin = { workspace = true }

[dependency-groups]
# Dev-only (not shipped in the published wheel).
dev = [
    # The workspace members whose source the corpora-py wheel bundles. They are
    # NOT runtime deps of corpora-py (their code ships inside it), but are
    # installed editable here so local dev/tests import them from their own
    # source trees and so each stays independently buildable/testable.
    "corpora-common",
    "corpora-mcp",
    "corpora-admin",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.0",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    # Context Fabric schema validation tests (tests/common/test_context_fabric_schemas.py).
    # Declared explicitly: the transitive pin via the mcp SDK is not a contract.
    "jsonschema>=4.26",
]

# ── Tool configuration (shared across workspace) ───────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-marker idiom (`= Form(...)`, `= Query(...)`, etc.) is
# the standard, documented way to declare request parameters -- not the
# mutable-default-argument footgun B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
# Third-party deps (ebooklib, text-fabric, supabase, ...) ship no type stubs.
ignore_missing_imports = true
exclude = [
    # Legacy standalone scripts superseded by admin.parsers/admin.converters;
    # not wired into PARSERS/CONVERTERS and full of pre-annotation-era code.
    "^packages/admin/src/admin/utils/",
    # tests/ uses pytest's conventional __init__.py-less layout, which mypy
    # rejects as duplicate "conftest" modules; the suite is validated by
    # running it, so type-check only the shipped packages.
    "^tests/",
]
# Aspirational strictness (disallow_untyped_defs, warn_return_any) is tracked
# as tech debt; the codebase does not satisfy it yet and CI runs mypy.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["packages", "src"]
omit = ["*/tests/*"]

[tool.vercel]
entrypoint = "src.corpora_py.app:app"
