[project]
name = "corpora-py"
version = "0.1.1"
description = "Graph-based biblical and religious text study platform"
readme = "README.md"
authors = [{ name = "Emmanuel De Freitas", email = "emmanuel@exegia.co" }]
requires-python = ">=3.13"
keywords = ["exegia", "bible", "corpus", "text-fabric", "context-fabric", "mcp", "graphql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    # MCP server
    "fastmcp>=2.0",
    # Corpus (core runtime uses context-fabric; text-fabric is for dataset conversion)
    "context-fabric>=0.5.0",
    # HTTP client
    "httpx>=0.27.0",
    # Config / env
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "dotenvx>=0.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyOpenSSL>=23.0.0",
    # Utilities
    "python-multipart>=0.0.9",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "supabase>=2.31.0",
    "watchfiles>=1.2.0",
    "platformdirs>=4.10.0",
]

[project.scripts]
cf-mcp = "exegia.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
full = [
    "text-fabric>=13.0.0",  # needed for conversion tools (epub/html → TF)
    # Admin / full corpus: install with [full]
    # Client consumer: base install is small. On opt-in, download prebuilt full runtime
    # (see scripts/build_client_python_runtime.py and scripts/ensure_python_runtime.py).
]

[tool.hatch.build.targets.wheel]
packages = ["src/exegia"]
