[project]
name = "corpora-py"
version = "0.1.1"
description = "Graph-based biblical and religious text study platform (all-in-one umbrella)"
readme = "README.md"
authors = [{ name = "Emmanuel De Freitas", email = "emmanuel@exegia.co" }]
requires-python = ">=3.13"
keywords = ["exegia", "bible", "corpus", "text-fabric", "context-fabric", "mcp", "graphql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
license = "MIT"
license-files = ["LICENSE"]
# Umbrella: pulling this installs all three workspace packages.
# Used by the sidecar/demo build to get everything in one install.
dependencies = [
    "corpora-admin>=0.1.1",
    "corpora-common>=0.1.1",
    "corpora-mcp>=0.1.1",
    "dotenvx>=0.0.0",
    # Corpus runtime
    "context-fabric>=0.5.0"
]

[project.scripts]
# Re-exported from corpora-client for convenience
cf-mcp = "mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Umbrella wheel — tiny corpora_py module; real code lives in workspace members.
packages = ["src/corpora_py"]

# ── uv workspace ──────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# Resolve workspace members from local paths during development
corpora-common = { workspace = true }
corpora-mcp = { workspace = true }
corpora-admin  = { workspace = true }

[dependency-groups]
# Dev-only tools (not shipped in any package)
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ── Tool configuration (shared across workspace) ───────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]
