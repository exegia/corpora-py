[project]
name = "corpora-client-py"
version = "0.1.2"
description = "MCP server and client tools for the Corpora platform"
readme = "../../README.md"
authors = [{ name = "Emmanuel De Freitas", email = "emmanuel@exegia.co" }]
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "mcp", "text-fabric", "context-fabric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "corpora-shared-py>=0.1.2",
    # MCP server
    "fastmcp>=2.0",
    # Corpus runtime
    "context-fabric>=0.5.0",
    # Multipart (for file uploads via MCP)
    "python-multipart>=0.0.9",
]

[project.scripts]
cf-mcp = "client.mcp:main"

[project.optional-dependencies]
# Enable SSE / HTTP transport (needed for remote MCP deployments)
sse = [
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
# Resolve corpora-shared-py from the local workspace during development
corpora-shared-py = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client"]
