[project]
name = "corpora-common"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.14.2",
    "fastapi>=0.139.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.10.0",
    "pyjwt>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
