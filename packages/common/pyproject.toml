
[project]
name = "corpora-common"
version = "0.1.1"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "pyOpenSSL>=24.0.0",
    "platformdirs>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
