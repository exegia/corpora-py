[project]
name = "corpora-mcp"
version = "1.3.1"
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "mcp", "text-fabric", "context-fabric"]

dependencies = [
    "corpora-common>=0.1.3",
    # MCP server
    "fastmcp>=3.4.2",
    # Corpus runtime
    # "context-fabric>=0.5.0",
    # Multipart (for file uploads via MCP)
    "python-multipart>=0.0.32",
]

[project.scripts]
cf-mcp = "corpora_mcp.server:main"

[project.optional-dependencies]
# Enable SSE / HTTP transport (needed for remote MCP deployments)
sse = [
    "uvicorn[standard]>=0.50.0",
]


[tool.uv.sources]
# Resolve common from the local workspace during development
corpora-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/corpora_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
