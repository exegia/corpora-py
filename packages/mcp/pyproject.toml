[project]
name = "mcp"
version = "0.1.1"
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "mcp", "text-fabric", "context-fabric"]

dependencies = [
    "common>=0.1.1",
    # MCP server
    "fastmcp>=2.0",
    # Corpus runtime
    # "context-fabric>=0.5.0",
    # Multipart (for file uploads via MCP)
    "python-multipart>=0.0.9",
]

[project.scripts]
cf-mcp = "mcp:main"

[project.optional-dependencies]
# Enable SSE / HTTP transport (needed for remote MCP deployments)
sse = [
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
# Resolve corpora-shared-py from the local workspace during development
mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel]
# packages = ["src/client"]
