[project]
name = "corpora-admin"
version = "0.1.2"
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "epub", "text-fabric", "converter"]

dependencies = [
    "corpora-common>=0.1.2",
    # EPUB / HTML parsing
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "python-multipart>=0.0.32",
    "text-fabric>=13.1.0",
    # PDF parsing
    "pypdf>=6.14.2",
    # Context-Fabric compilation (.cfm) and .corpus packaging
    "context-fabric>=0.5.7",
    "pyyaml>=6.0.3",
    "huggingface-hub>=1.0",
]

[tool.uv.sources]
# Resolve corpora-shared-py from the local workspace during development
corpora-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/admin"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
