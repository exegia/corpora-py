[project]
name = "corpora-admin-py"
version = "0.1.1"
description = "Admin and conversion tools for the Corpora platform (EPUB/HTML → Text-Fabric)"
readme = "../../README.md"
authors = [{ name = "Emmanuel De Freitas", email = "emmanuel@exegia.co" }]
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "epub", "text-fabric", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "corpora-shared-py>=0.1.1",
    # EPUB / HTML parsing
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-multipart>=0.0.9",
    "text-fabric>=13.1.0",
    # PDF parsing
    "pypdf>=5.0.0",
]

[tool.uv.sources]
# Resolve corpora-shared-py from the local workspace during development
corpora-shared-py = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin"]
