[project]
name = "corpora-admin"
version = "0.1.1"
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "epub", "text-fabric", "converter"]
dependencies = [
    "corpora-common>=0.1.1",
    # EPUB / HTML parsing
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-multipart>=0.0.9",
    "text-fabric>=13.1.0",
    # PDF parsing
    "pypdf>=5.0.0",
    # Context-Fabric compilation (.cfm) and .corpus packaging
    "context-fabric>=0.5.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
# Resolve common from the local workspace during development
corpora-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/admin"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
