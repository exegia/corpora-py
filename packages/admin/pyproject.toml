[project]
name = "corpora-admin"
version = "4.0.0"
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "epub", "text-fabric", "converter"]

dependencies = [
    "corpora-common>=0.1.3",
    # EPUB / HTML parsing
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "python-multipart>=0.0.32",
    "text-fabric>=13.1.0",
    # PDF parsing
    "pypdf>=6.14.2",
    # PDF classification (text-based vs scanned) + markdown extraction for
    # pre-conversion validation and the PDF markdown route
    "pdf-inspector>=1.17.0",
    # Context-Fabric compilation (.cfm) and .corpus packaging
    "context-fabric>=0.5.7",
    "pyyaml>=6.0.3",
    "huggingface-hub>=1.0",
    # Docling data model (lightweight) + Context Fabric schema validation
    # for admin.ingest -- the heavy Docling converter itself is the
    # [docling] extra below.
    "docling-core>=2.30",
    "jsonschema>=4.25",
    "referencing>=0.36",
]

[project.optional-dependencies]
# The full Docling converter (layout models, OCR, table structure -- pulls
# torch). Needed at runtime by `admin.ingest.parse_file` / `POST /ingest`;
# everything else in admin.ingest works with docling-core alone.
docling = ["docling>=2.0"]

[tool.uv.sources]
# Resolve corpora-shared-py from the local workspace during development
corpora-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/admin"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
