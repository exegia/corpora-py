[project]
name = "corpora-shared-py"
version = "0.1.1"
description = "Shared auth, models, schemas, and Supabase client for the Corpora platform"
readme = "../../README.md"
authors = [{ name = "Emmanuel De Freitas", email = "emmanuel@exegia.co" }]
requires-python = ">=3.13"
keywords = ["exegia", "corpora", "bible", "supabase", "auth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Config / env
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "dotenvx>=0.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyOpenSSL>=23.0.0",
    # HTTP
    "httpx>=0.27.0",
    # Utilities
    "platformdirs>=4.10.0",
    "watchfiles>=1.2.0",
    "fastapi>=0.138.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
