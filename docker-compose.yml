# docker-compose.yml
# Local orchestration for the Corpora platform services.
#
# Services:
#   client  — MCP server (SSE on 8000). Connect Claude Desktop or any MCP client.
#   admin   — Admin/conversion tools shell. Run conversion commands interactively.
#
# Quick start:
#   docker compose up client                      # start MCP server
#   docker compose --profile admin run --rm admin # admin shell
#   docker compose up                             # start all default services
#
# Env vars: copy .env.example → .env and fill in values, or export them in your shell.
#   Required: PROJECT_REF, SUPABASE_SECRET_KEY
#   Optional: DATASETS_DIR (default: ~/.exegia/datasets), SOURCES_DIR (default: ~/sources)

services:
  api:
    restart: unless-stopped
    env_file:
      - .env
    build:
      context: ./
      dockerfile: ./dockerfiles/python${PYTHON_VERSION}/Dockerfile
      labels:
        - fastapi
    ports:
      - "5001:5001"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5002:5002"
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    depends_on:
      - api

  # ── MCP server (corpora-client-py) ─────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: corpora-client:latest
    container_name: corpora-mcp
    ports:
      - "8000:8000"
    volumes:
      # Mount your local datasets directory read-only.
      # Override: DATASETS_DIR=/path/to/datasets docker compose up client
      - "${DATASETS_DIR:-~/.exegia/datasets}:/data/datasets:ro"
    env_file:
      - path: .env
        required: false # silently skipped if .env doesn't exist; use shell env instead
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PROJECT_REF: ${PROJECT_REF}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from client.mcp import corpus_manager; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Admin / conversion tools (corpora-admin-py[full]) ──────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: corpora-admin:latest
    container_name: corpora-admin
    command: >
      python -c " import time, sys print('corpora-admin ready. Available: admin.utils.*')
      sys.stdout.flush() time.sleep(86400) "
    volumes:
      - "${DATASETS_DIR:-~/.exegia/datasets}:/data/datasets"
      - "${SOURCES_DIR:-~/sources}:/data/sources:ro"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    profiles:
      # Only start when explicitly requested:
      #   docker compose --profile admin up
      - admin

volumes:
  caddy_data:
  caddy_config:
