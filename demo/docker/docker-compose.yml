# demo/app/docker-compose.yml
# Spin up a reproducible dev environment for the ElectroBun demo.
#
# The container includes:
# - Bun + ElectroBun for the desktop app
# - Python 3.13 + uv + the local `exegia` / corpora-py library (editable)
# - SSH server (port 2222 on host) so your IDE can connect for full dev experience
#
# Quick start:
#   docker compose -f demo/app/docker-compose.yml up --build -d
#
# Connect:
#   ssh -p 2222 dev@localhost          # default password: "dev"
#
# For passwordless (recommended):
#   export SSH_PUBKEY="$(cat ~/.ssh/id_ed25519.pub)"
#   docker compose -f demo/app/docker-compose.yml up --build -d
#
# Inside container (after SSH or `docker compose exec demo bash`):
#   cd /workspace/demo/app
#   bun run dev:hmr
#
# The Python bridge will automatically use the dev Python that has the local library.

services:
  demo:
    build:
      context: ../.. # Build context = monorepo root (so we see the Python package + demo)
      dockerfile: demo/app/Dockerfile
    image: ghcr.io/exegia/corpora-py-demo-dev:latest
    container_name: corpora-demo-dev
    ports:
      - "2222:22" # SSH
      - "5173:5173" # Vite HMR (useful even if the native window isn't forwarded)
    environment:
      # Inject your SSH public key for passwordless login (recommended)
      - SSH_PUBKEY=${SSH_PUBKEY:-}
      # These are consumed by the updated python-bridge.ts + entrypoint
      - DEV_PYTHON_BIN=/workspace/demo/app/resources/python/bin/python3
      - DEV_PYTHON_HOME=/workspace/demo/app/resources/python
    volumes:
      # Live mount the entire monorepo for editing TS, Python, etc.
      - ../..:/workspace
      # Persist Bun deps / node_modules inside the container (avoids host pollution)
      - demo-node-modules:/workspace/demo/app/node_modules
      # Optional: bring your own SSH key for easy authorized_keys injection
      # - ~/.ssh:/host-ssh:ro
    # For X11 forwarding of the native ElectroBun window (advanced / Linux host only)
    # environment:
    #   - DISPLAY=${DISPLAY:-:0}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # network_mode: host   # sometimes needed for X11
    tty: true
    stdin_open: true
    # The entrypoint prepares everything and then runs sshd by default.

volumes:
  demo-node-modules: {}
