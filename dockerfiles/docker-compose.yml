# docker-compose.yml
# Local orchestration for the Corpora platform services.
#
# Services:
#   client  — MCP server (SSE on 8000). Connect Claude Desktop or any MCP client.
#   admin   — Admin/conversion tools shell. Run conversion commands interactively.
#
# Quick start:
#   docker compose up client                      # start MCP server
#   docker compose --profile admin run --rm admin # admin shell
#   docker compose up                             # start all default services
#
# Env vars: copy .env.example → .env and fill in values, or export them in your shell.
#   Required: PROJECT_REF, SUPABASE_SECRET_KEY
#   Optional: DATASETS_DIR (default: ~/.exegia/datasets), SOURCES_DIR (default: ~/sources)

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    env_file:
      - path: .env.development
        required: false # silently skipped if .env doesn't exist; use shell env instead
    ports:
      - "5002:5002"
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    depends_on:
      - corpora

  # ── Combined FastAPI app: MCP server + admin conversion API (corpora-py) ───
  corpora:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile
    image: corpora-py:latest
    container_name: corpora-py
    ports:
      - "8000:8000"
    volumes:
      # Mount your local datasets directory read-only.
      - "${DATASETS_DIR:-~/.corpora/datasets}:/data/datasets"
      - "${SOURCES_DIR:-~/sources}:/data/sources:ro"
    env_file:
      - path: .env.development
        required: false # silently skipped if .env doesn't exist; use shell env instead
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Defaults to secure (matches common.utils.config.Settings.auth_required's
      # own default). `make docker-up-corpora` sets this to `false` at
      # invocation time for local/demo use -- without this line, that shell
      # var never reached the container and auth stayed enforced regardless.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from corpora_mcp.corpus import corpus_manager; print('ok')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:
